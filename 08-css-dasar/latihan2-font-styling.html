<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan 2 - Font Styling</title>
  <style>
    body{
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      color: rgb(61, 61, 61);
      text-align: center;
    }
    h1{
      font-size: 48px;
      text-transform: uppercase;
      font-style: italic;
      letter-spacing: 10px;
      text-decoration: underline;
      text-decoration-style: wavy;
      text-decoration-color: rgb(100, 100, 100);
      text-shadow: 5px 5px 0 rgb(215, 215, 215);
    }
    .qoute{
      font-size: 22px;
      line-height: 2.2;
      word-spacing: 5px;
    }

    .credit{
      font-size: 12px;
      letter-spacing: 2px;
      color: rgba(151, 151, 151);
      font-weight: normal;
    }

    .span{
      color: rgb(181, 181, 181);
      text-decoration: line-through;
    }
  </style>
</head>
<body>
  <h1>Fase Runtuh</h1>
  <p class="qoute" >"Tak perlu khawatir, ku hanya <span class="span"> terluka </span>. br Terbiasa tuk pura-pura tertawa. <br>
    Namun bolehkah sekali saja ku menangis? <br> Sebelum kembali membohongi diri."</p>
  <p class="credit" >-feby putri feat. fiersa besari</p>
</body>
</html>
