<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiple Backgrounds</title>
  <style>
    body{
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #333;
    }

    .frame{
      width: 400px;
      height: 400px;
      border: 10px solid #fff;
      margin: auto;
      background-image: url(img/me.png), url(img/blop-removebg-preview.png), url(img/image_2777be30.png);
      background-size: 320px, 400px , 700px;
      background-repeat: no-repeat, no-repeat, no-repeat;
      background-position: center bottom , center 70%, bottom left;
      background-color: #f0f0f0;
      border-radius: 50%;
    }

    h1{
      color: #fff;
      text-align: center;
      font-family: 'courier new', courier, monospace;
      font-size: 40px;
      text-shadow: 2px 2px 4px #000;
    }
  </style>
</head>
<body>
  <h1>My Profile Card</h1>
  <div class="frame"></div>
</body>
</html>
